events {}

http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 32m;

  log_format production_local '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent';
  access_log /var/log/nginx/access.log production_local;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8443 ssl;
    server_name proof-agent.localhost;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /gateway-health {
      access_log off;
      return 200 'healthy\n';
      add_header Content-Type text/plain;
    }

    location /oidc/ {
      set $keycloak_upstream http://keycloak:8080;
      proxy_pass $keycloak_upstream;
      proxy_set_header Host $host:$server_port;
      proxy_set_header X-Forwarded-Host $host:$server_port;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      set $api_upstream http://api:8000;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host:$server_port;
      proxy_set_header X-Forwarded-Host $host:$server_port;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 300s;
    }
  }

  server {
    listen 8200 ssl;
    server_name vault.internal;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      set $vault_upstream http://vault:8200;
      proxy_pass $vault_upstream;
      proxy_set_header Host vault.internal:8200;
    }
  }

  server {
    listen 8444 ssl;
    server_name proof-agent.localhost;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      set $kss_upstream http://kss-api:8080;
      proxy_pass $kss_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host:$server_port;
      proxy_set_header X-Forwarded-Host $host:$server_port;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 300s;
    }
  }

  server {
    listen 9200 ssl;
    server_name opensearch.internal;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      set $opensearch_upstream http://opensearch:9200;
      proxy_pass $opensearch_upstream;
      proxy_set_header Host opensearch.internal:9200;
    }
  }

  server {
    listen 9443 ssl;
    server_name models.internal;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      set $models_upstream http://model-plane:8081;
      rewrite ^/(.*)$ /scheduler/$1 break;
      proxy_pass $models_upstream;
      proxy_set_header Host models.internal:9443;
      proxy_read_timeout 600s;
    }
