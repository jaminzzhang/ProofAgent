name: proofagent-knowledge

x-postgres-secret: &postgres-secret
  source: postgres_dsn
  target: kss-postgres-dsn
  uid: "10001"
  gid: "10001"
  mode: 0400

x-operator-secret: &operator-secret
  source: operator_token
  target: kss-operator-token
  uid: "10001"
  gid: "10001"
  mode: 0400

x-projection-encoder-secret: &projection-encoder-secret
  source: projection_encoder_token
  target: kss-projection-encoder-token
  uid: "10001"
  gid: "10001"
  mode: 0400

x-agentic-controller-secret: &agentic-controller-secret
  source: agentic_controller_token
  target: kss-agentic-controller-token
  uid: "10001"
  gid: "10001"
  mode: 0400

x-ocr-secret: &ocr-secret
  source: ocr_token
  target: kss-ocr-token
  uid: "10001"
  gid: "10001"
  mode: 0400

x-s3-access-key-secret: &s3-access-key-secret
  source: s3_access_key_id
  target: kss-s3-access-key-id
  uid: "10001"
  gid: "10001"
  mode: 0400

x-s3-secret-key-secret: &s3-secret-key-secret
  source: s3_secret_access_key
  target: kss-s3-secret-access-key
  uid: "10001"
  gid: "10001"
  mode: 0400

x-kss-service: &kss-service
  image: "${KSS_IMAGE:?set an immutable name@sha256 image reference}"
  user: "10001:10001"
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  restart: unless-stopped
  init: true
  env_file:
    - "${KSS_ENV_FILE:?set the KSS release env file}"
  configs:
    - source: internal_ca
      target: /run/configs/internal-ca.pem
      mode: 0444
  secrets:
    - *postgres-secret
  tmpfs:
    - /tmp:size=64m,mode=0700,uid=10001,gid=10001
  networks:
    knowledge: {}

services:
  migrate:
    <<: *kss-service
    command: ["migrate"]
    profiles: ["migration"]
    restart: "no"
    cpus: "1.0"
    mem_limit: 512m

  api:
    <<: *kss-service
    command: ["api"]
    expose: ["8080"]
    secrets:
      - *postgres-secret
      - *operator-secret
      - *projection-encoder-secret
      - *agentic-controller-secret
      - *ocr-secret
      - *s3-access-key-secret
      - *s3-secret-key-secret
    cpus: "2.0"
    mem_limit: 2g
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      knowledge:
        aliases: ["knowledge-source-service"]

  query-executor:
    <<: *kss-service
    command: ["query-executor"]
    secrets:
      - *postgres-secret
      - *projection-encoder-secret
      - *agentic-controller-secret
      - *s3-access-key-secret
      - *s3-secret-key-secret
    cpus: "4.0"
    mem_limit: 6g
    stop_grace_period: 150s

  knowledge-worker:
    <<: *kss-service
    command: ["knowledge-worker"]
    secrets:
      - *postgres-secret
      - *s3-access-key-secret
      - *s3-secret-key-secret
    cpus: "4.0"
    mem_limit: 8g
    stop_grace_period: 150s

  sync-scheduler:
    <<: *kss-service
    command: ["sync-scheduler"]
    cpus: "1.0"
    mem_limit: 1g

networks:
  knowledge:
    external: true
    name: "${KSS_NETWORK:?set the external KSS network}"

configs:
  internal_ca:
    file: "${KSS_TLS_CA_FILE:?set the reviewed internal CA bundle}"

secrets:
  postgres_dsn:
    external: true
    name: "${KSS_POSTGRES_DSN_SECRET:?set the external PostgreSQL DSN secret}"
  operator_token:
    external: true
    name: "${KSS_OPERATOR_TOKEN_SECRET:?set the external operator token secret}"
  projection_encoder_token:
    external: true
    name: "${KSS_PROJECTION_ENCODER_TOKEN_SECRET:?set the external encoder token secret}"
  agentic_controller_token:
    external: true
    name: "${KSS_AGENTIC_CONTROLLER_TOKEN_SECRET:?set the external controller token secret}"
  ocr_token:
    external: true
    name: "${KSS_OCR_TOKEN_SECRET:?set the external OCR token secret}"
  s3_access_key_id:
    external: true
    name: "${KSS_S3_ACCESS_KEY_ID_SECRET:?set the external S3 access-key secret}"
  s3_secret_access_key:
    external: true
    name: "${KSS_S3_SECRET_ACCESS_KEY_SECRET:?set the external S3 secret-key secret}"
