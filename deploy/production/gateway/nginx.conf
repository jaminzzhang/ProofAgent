pid /tmp/nginx.pid;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    limit_req_zone $binary_remote_addr zone=proofagent_ip:10m rate=20r/s;
    map $cookie_proof_agent_session $proofagent_admission_key {
        default $cookie_proof_agent_session;
        "" $binary_remote_addr;
    }
    limit_req_zone $proofagent_admission_key zone=proofagent_session:10m rate=10r/s;

    include /etc/nginx/proofagent/active-upstreams.conf;
    include /etc/nginx/proofagent/admission-control.conf;

    server {
        listen 8443 ssl;
        server_name proof-agent.invalid;

        ssl_certificate /run/secrets/tls.crt;
        ssl_certificate_key /run/secrets/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;

        client_max_body_size 16m;
        client_header_timeout 10s;
        client_body_timeout 30s;
        keepalive_timeout 30s;
        send_timeout 130s;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header X-ProofAgent-Routing-Generation $proofagent_routing_generation always;
        add_header X-ProofAgent-Routing-Slot $proofagent_routing_slot always;

        limit_req zone=proofagent_ip burst=40 nodelay;
        limit_req zone=proofagent_session burst=20 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
        proxy_request_buffering on;

        location = /api/auth/callback {
            proxy_pass http://proofagent_api;
        }

        location ~ ^/api/runs/.+/(progress|events)$ {
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection "";
            proxy_pass http://proofagent_api;
        }

        location /api/ {
            if ($proofagent_run_admission_blocked) {
                return 503;
            }
            proxy_pass http://proofagent_api;
        }

        location = /operator {
            proxy_pass http://proofagent_operator_chat/;
        }

        location /operator/ {
            rewrite ^/operator/(.*)$ /$1 break;
            proxy_pass http://proofagent_operator_chat;
        }

        location / {
            proxy_pass http://proofagent_dashboard;
        }
    }
}
